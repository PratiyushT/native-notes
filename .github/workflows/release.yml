name: Publish distribution

on:
  push:
    tags: ['[0-9]*']

permissions:
  contents: read

concurrency:
  group: publish-distribution
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'PratiyushT/native-notes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate prebuilt distribution
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const tag = process.env.RELEASE_TAG;
          if (!/^\d+\.\d+\.\d+$/.test(tag)) throw new Error('Invalid release tag.');
          const expected = [
            'main.js', 'styles.css', 'manifest.json', 'versions.json', 'README.md', 'LICENSE', 'THIRD-PARTY-NOTICES.md',
            'docs/INSTALL.md', 'docs/CODE-HIGHLIGHTING.md', 'docs/SYNC.md', 'docs/images/README.md',
            'docs/images/appearance-settings.png', 'docs/images/code-highlighting.png', 'docs/images/code-settings.png',
            'docs/images/notes-light.png', 'docs/images/ocean-dark.png', 'docs/images/optional-features.png', 'docs/images/profile-settings.png',
            'docs/images/math-settings.png', 'docs/images/math-keyboard-light.png', 'docs/images/math-keyboard-dark.png',
            'docs/images/math-button-light.png', 'docs/images/math-button-dark.png', 'docs/images/flowchart-builder.png', 'docs/images/slash-menu.png',
            `docs/RELEASE-${tag}.md`, '.github/workflows/release.yml',
          ].sort();
          const entries = execFileSync('git', ['ls-files', '-s', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const actual = entries.map(entry => {
            const match = /^100644 [a-f\d]+ 0\t([\s\S]+)$/.exec(entry);
            if (!match) throw new Error('Only regular distribution files are allowed.');
            return match[1];
          }).sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error('Unexpected distribution files.');
          for (const file of expected) {
            if (!fs.lstatSync(file).isFile()) throw new Error(`Not a regular file: ${file}`);
            const contents = fs.readFileSync(file);
            if (!contents.length) throw new Error(`Empty file: ${file}`);
            if (['main.js', 'manifest.json', 'styles.css'].includes(file) && contents.length > 5000000) throw new Error(`Asset too large: ${file}`);
            if (!file.endsWith('.png') && /^\s*(?:\/\/|\/\*)[#@]\s*sourceMappingURL\s*=/m.test(contents.toString('utf8'))) throw new Error(`Source map in ${file}`);
          }
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const versions = JSON.parse(fs.readFileSync('versions.json', 'utf8'));
          if (manifest.id !== 'native-notes' || manifest.version !== tag || versions[tag] !== manifest.minAppVersion) throw new Error('Release metadata mismatch.');
          execFileSync('git', ['fetch', 'origin', 'main'], { stdio: 'inherit' });
          const parent = execFileSync('git', ['rev-parse', 'refs/remotes/origin/main'], { encoding: 'utf8' }).trim();
          execFileSync('git', ['merge-base', '--is-ancestor', parent, process.env.GITHUB_SHA]);
          const previous = JSON.parse(execFileSync('git', ['show', `${parent}:manifest.json`], { encoding: 'utf8' })).version;
          if (!/^\d+\.\d+\.\d+$/.test(previous)) throw new Error('Invalid current distribution version.');
          const nextParts = tag.split('.').map(BigInt), previousParts = previous.split('.').map(BigInt);
          const changed = nextParts.findIndex((value, index) => value !== previousParts[index]);
          if (changed === -1 || nextParts[changed] < previousParts[changed]) throw new Error('Release is not newer than current main.');
          NODE
      - name: Attest published distribution files
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Stage, verify and publish release before advancing main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { createHash } = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const tag = process.env.RELEASE_TAG;
          const repo = process.env.GH_REPO;
          if (repo !== 'PratiyushT/native-notes' || !/^\d+\.\d+\.\d+$/.test(tag)) throw new Error('Invalid release destination or tag.');
          const expected = ['main.js', 'manifest.json', 'styles.css'].sort();
          const notesFile = `docs/RELEASE-${tag}.md`;
          const normalizeNotes = text => text.replace(/\r\n/g, '\n').trimEnd();
          const notes = normalizeNotes(fs.readFileSync(notesFile, 'utf8'));
          const gh = (args, input) => execFileSync('gh', args, { encoding: 'utf8', stdio: ['pipe', 'pipe', 'pipe'], input });
          function api(args, input) {
            let output;
            try { output = gh(['api', ...args], input); }
            catch (error) { throw new Error(`GitHub API request failed: ${args.join(' ')}`, { cause: error }); }
            try { return JSON.parse(output); }
            catch (error) { throw new Error('GitHub API returned invalid JSON.', { cause: error }); }
          }
          function findRelease() {
            // The by-tag REST endpoint only returns published releases. Listing
            // with this write-capable token also includes drafts on every page.
            const pages = api(['--paginate', '--slurp', `repos/${repo}/releases?per_page=100`]);
            if (!Array.isArray(pages) || !pages.every(Array.isArray)) throw new Error('Invalid GitHub release listing.');
            const releases = pages.flat();
            if (!releases.every(release => release && typeof release.tag_name === 'string' && Number.isSafeInteger(release.id) && release.id > 0)) throw new Error('Invalid GitHub release listing.');
            const matches = releases.filter(release => release.tag_name === tag);
            if (matches.length > 1) throw new Error('Multiple releases match this tag; inspect them manually.');
            return matches[0];
          }
          function releaseId(release) {
            if (!Number.isSafeInteger(release?.id) || release.id <= 0) throw new Error('Missing or invalid GitHub release ID.');
            return release.id;
          }
          function verifyRelease(release, id, draft) {
            if (!release || release.id !== id || release.tag_name !== tag) throw new Error('GitHub release identity does not match this tag.');
            if (release.draft !== draft) throw new Error(draft ? 'Release is already published; refusing to modify it.' : 'Release was not published successfully.');
            if (draft && release.immutable !== false) throw new Error('Draft is immutable or has unknown immutability; refusing to modify it.');
            if (release.prerelease !== false || release.name !== `Native Notes ${tag}` || typeof release.body !== 'string' || normalizeNotes(release.body) !== notes) {
              throw new Error('GitHub release metadata does not match this distribution.');
            }
            if (!Array.isArray(release.assets)) throw new Error('GitHub release response is missing its assets array.');
            const names = release.assets.map(asset => asset?.name).sort();
            if (JSON.stringify(names) !== JSON.stringify(expected)) throw new Error('Expected exactly main.js, manifest.json and styles.css; inspect partial or unexpected draft assets manually.');
            for (const asset of release.assets) {
              const contents = fs.readFileSync(asset.name);
              const digest = 'sha256:' + createHash('sha256').update(contents).digest('hex');
              if (asset.state !== 'uploaded' || asset.digest !== digest || asset.size !== contents.length) throw new Error(`Release asset does not match distribution: ${asset.name}`);
            }
          }
          let release = findRelease();
          if (!release) {
            gh(['release', 'create', tag, ...expected, '--verify-tag', '--draft', '--title', `Native Notes ${tag}`, '--notes-file', notesFile]);
            release = findRelease();
          }
          const id = releaseId(release);
          const endpoint = `repos/${repo}/releases/${id}`;
          // Reuse a complete matching draft without changing any uploaded asset.
          // Incomplete drafts require explicit recovery instead of overwrites.
          verifyRelease(api([endpoint]), id, true);
          const published = api(['--method', 'PATCH', endpoint, '--input', '-'], JSON.stringify({ draft: false, make_latest: 'true' }));
          verifyRelease(published, id, false);
          api(['--method', 'PATCH', `repos/${repo}/git/refs/heads/main`, '-f', `sha=${process.env.GITHUB_SHA}`, '-F', 'force=false']);
          NODE
